<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rocket Space Game</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            overflow: hidden;
            font-family: 'Arial', sans-serif;
        }

        #gameCanvas {
            display: block;
            background: linear-gradient(to bottom, #000428 0%, #004e92 50%, #87ceeb 100%);
        }

        #ui {
            position: absolute;
            top: 20px;
            left: 20px;
            color: white;
            font-size: 20px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.8);
            z-index: 10;
        }

        #controls {
            position: absolute;
            top: 20px;
            right: 20px;
            color: white;
            font-size: 16px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.8);
            z-index: 10;
            text-align: right;
        }

        #gameOver {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: white;
            font-size: 48px;
            text-shadow: 3px 3px 6px rgba(0,0,0,0.8);
            display: none;
            text-align: center;
            z-index: 20;
        }

        #gameOver .subtitle {
            font-size: 24px;
            margin-top: 20px;
        }

        .fuel-bar {
            width: 200px;
            height: 20px;
            border: 2px solid white;
            border-radius: 10px;
            margin-top: 10px;
            background: rgba(0,0,0,0.5);
            overflow: hidden;
        }

        .fuel-fill {
            height: 100%;
            background: linear-gradient(to right, #ff0000, #ffff00, #00ff00);
            transition: width 0.3s;
        }
    </style>
</head>
<body>
    <canvas id="gameCanvas"></canvas>

    <div id="ui">
        <div>Velocità: <span id="speed">0</span> km/h</div>
        <div>Altitudine: <span id="altitude">0</span> m</div>
        <div>Carburante:</div>
        <div class="fuel-bar">
            <div class="fuel-fill" id="fuelBar"></div>
        </div>
        <div style="margin-top: 10px;">Stato: <span id="status">Pronto al decollo</span></div>
        <div id="nearPlanet" style="margin-top: 10px; color: #ffaa00; font-weight: bold;"></div>
    </div>

    <div id="controls">
        <div>CONTROLLI:</div>
        <div>BARRA SPAZIATRICE - Accelera (+20%)</div>
        <div>R - Ricomincia</div>
    </div>

    <div id="gameOver">
        <div id="crashMessage">SCHIANTO!</div>
        <div class="subtitle">Premi R per ricominciare</div>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;

        // Game state
        let gameState = {
            rocket: {
                x: canvas.width / 2,
                y: canvas.height - 100,
                initialY: canvas.height - 100,
                width: 40,
                height: 80,
                velocity: 0,
                maxVelocity: 450,  // Higher max speed to reach distant objects
                acceleration: 0,
                angle: 0
            },
            fuel: 500,
            maxFuel: 500,
            fuelConsumption: 0.8,  // Very low consumption for extended exploration
            isLaunched: false,
            isCrashed: false,
            gravity: 0.05,  // Minimal gravity for deep space travel
            spaceStart: canvas.height * 0.3,
            groundLevel: canvas.height - 50,
            initialGroundLevel: canvas.height - 50,
            cameraOffset: (canvas.height - 100) - (canvas.height * 0.6), // Initial camera position
            stars: [],
            planets: [],
            asteroids: [],
            galaxies: [],
            particles: [],
            buildings: []
        };

        // Initialize stars (distributed across ALL of space - up to 200k altitude)
        const initialRocketY = canvas.height - 100;
        for (let i = 0; i < 2000; i++) {
            gameState.stars.push({
                x: Math.random() * canvas.width,
                // Stars distributed from 500 to 200000 units above starting position
                y: initialRocketY - 500 - Math.random() * 199500,
                size: Math.random() * 2.5 + 0.5,
                opacity: Math.random() * 0.8 + 0.2,
                twinkle: Math.random() * Math.PI * 2 // For twinkling effect
            });
        }

        // Initialize planets (distributed throughout the journey to 200k)
        // Sistema solare - vicino alla Terra
        gameState.planets.push({
            name: 'ISS',
            x: canvas.width * 0.3,
            y: initialRocketY - 400,
            size: 30,
            color: '#cccccc',
            isStation: true
        });

        gameState.planets.push({
            name: 'Luna',
            x: canvas.width * 0.2,
            y: initialRocketY - 1500,
            size: 70,
            color: '#d4d4d4',
            craters: true
        });

        gameState.planets.push({
            name: 'Marte',
            x: canvas.width * 0.7,
            y: initialRocketY - 8000,
            size: 85,
            color: '#cd5c5c',
            hasAtmosphere: true,
            atmosphereColor: 'rgba(205, 92, 92, 0.3)'
        });

        gameState.planets.push({
            name: 'Giove',
            x: canvas.width * 0.4,
            y: initialRocketY - 25000,
            size: 140,
            color: '#daa520',
            stripes: true
        });

        gameState.planets.push({
            name: 'Saturno',
            x: canvas.width * 0.8,
            y: initialRocketY - 50000,
            size: 120,
            color: '#f4a460',
            hasRings: true
        });

        gameState.planets.push({
            name: 'Urano',
            x: canvas.width * 0.25,
            y: initialRocketY - 85000,
            size: 95,
            color: '#4fd0e7',
            hasAtmosphere: true,
            atmosphereColor: 'rgba(79, 208, 231, 0.3)'
        });

        gameState.planets.push({
            name: 'Nettuno',
            x: canvas.width * 0.6,
            y: initialRocketY - 120000,
            size: 90,
            color: '#4169e1',
            hasAtmosphere: true,
            atmosphereColor: 'rgba(65, 105, 225, 0.4)'
        });

        gameState.planets.push({
            name: 'Plutone',
            x: canvas.width * 0.45,
            y: initialRocketY - 160000,
            size: 50,
            color: '#b08968',
            craters: true
        });

        // Campi di asteroidi
        for (let i = 0; i < 50; i++) {
            gameState.asteroids.push({
                x: Math.random() * canvas.width,
                y: initialRocketY - 3000 - Math.random() * 15000, // Between 3k-18k
                size: Math.random() * 8 + 3,
                rotation: Math.random() * Math.PI * 2,
                rotationSpeed: (Math.random() - 0.5) * 0.02,
                color: '#8b7355'
            });
        }

        // Galassie lontane
        for (let i = 0; i < 8; i++) {
            gameState.galaxies.push({
                x: Math.random() * canvas.width,
                y: initialRocketY - 100000 - Math.random() * 90000, // Deep space 100k-190k
                size: 80 + Math.random() * 60,
                rotation: Math.random() * Math.PI * 2,
                color: ['#ff00ff', '#00ffff', '#ffff00', '#ff6600'][Math.floor(Math.random() * 4)]
            });
        }

        // Initialize buildings (city)
        for (let i = 0; i < 15; i++) {
            gameState.buildings.push({
                x: i * (canvas.width / 15),
                width: canvas.width / 15 - 10,
                height: 50 + Math.random() * 100,
                color: `rgb(${100 + Math.random() * 100}, ${100 + Math.random() * 100}, ${100 + Math.random() * 100})`
            });
        }

        // Input handling
        let keys = {};

        window.addEventListener('keydown', (e) => {
            keys[e.code] = true;

            if (e.code === 'Space') {
                e.preventDefault();
                if (!gameState.isCrashed && gameState.fuel > 0) {
                    // Start launch or boost
                    gameState.isLaunched = true;
                    // Moderate boost - slow enough to enjoy, fast enough to reach far objects
                    gameState.rocket.velocity -= gameState.rocket.velocity * 0.12 + 8;
                    // Consume fuel
                    gameState.fuel = Math.max(0, gameState.fuel - gameState.fuelConsumption);

                    // Add boost particles
                    createBoostParticles();
                }
            }

            if (e.code === 'KeyR') {
                resetGame();
            }
        });

        window.addEventListener('keyup', (e) => {
            keys[e.code] = false;
        });

        function createBoostParticles() {
            for (let i = 0; i < 10; i++) {
                gameState.particles.push({
                    x: gameState.rocket.x + (Math.random() - 0.5) * 20,
                    y: gameState.rocket.y + gameState.rocket.height / 2,
                    vx: (Math.random() - 0.5) * 4,
                    vy: Math.random() * 8 + 2,
                    size: Math.random() * 5 + 2,
                    life: 1,
                    color: Math.random() > 0.5 ? '#ff6600' : '#ffaa00'
                });
            }
        }

        function createCrashParticles() {
            for (let i = 0; i < 50; i++) {
                gameState.particles.push({
                    x: gameState.rocket.x,
                    y: gameState.rocket.y,
                    vx: (Math.random() - 0.5) * 15,
                    vy: (Math.random() - 0.5) * 15,
                    size: Math.random() * 8 + 2,
                    life: 1,
                    color: ['#ff0000', '#ff6600', '#ffaa00', '#888888'][Math.floor(Math.random() * 4)]
                });
            }
        }

        function update() {
            if (gameState.isCrashed) return;

            // Apply gravity
            if (gameState.isLaunched) {
                if (gameState.fuel > 0) {
                    // In flight with fuel
                    gameState.rocket.velocity += gameState.gravity;
                } else {
                    // Out of fuel - falling (very slow fall for scenic return)
                    gameState.rocket.velocity += gameState.gravity * 1.1;
                }
            }

            // Update rocket position (in world coordinates)
            gameState.rocket.y += gameState.rocket.velocity;

            // Clamp velocity
            gameState.rocket.velocity = Math.min(gameState.rocket.velocity, gameState.rocket.maxVelocity);

            // Check if crashed (in world coordinates - ground is always at initialGroundLevel)
            if (gameState.rocket.y >= gameState.initialGroundLevel - gameState.rocket.height) {
                gameState.rocket.y = gameState.initialGroundLevel - gameState.rocket.height;
                if (gameState.isLaunched) {
                    gameState.isCrashed = true;
                    document.getElementById('gameOver').style.display = 'block';
                    createCrashParticles();
                }
            }

            // Update camera position to follow rocket
            if (gameState.isLaunched) {
                const targetScreenY = canvas.height * 0.6; // Keep rocket at 60% from top
                gameState.cameraOffset = gameState.rocket.y - targetScreenY;

                // Don't move camera above initial position
                const initialCameraOffset = gameState.rocket.initialY - targetScreenY;
                if (gameState.cameraOffset > initialCameraOffset) {
                    gameState.cameraOffset = initialCameraOffset;
                }
            } else {
                // Camera at initial position when not launched
                gameState.cameraOffset = gameState.rocket.initialY - (canvas.height * 0.6);
            }

            // Update particles (in world coordinates)
            gameState.particles = gameState.particles.filter(p => {
                p.x += p.vx;
                p.y += p.vy;
                p.life -= 0.02;
                return p.life > 0;
            });

            // Slight rocket tilt based on velocity
            if (gameState.fuel > 0 && gameState.isLaunched) {
                gameState.rocket.angle = Math.sin(Date.now() / 100) * 0.1;
            } else if (gameState.fuel === 0 && gameState.isLaunched) {
                gameState.rocket.angle = Math.sin(Date.now() / 50) * 0.3;
            }
        }

        function draw() {
            // Clear canvas
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // Calculate real altitude (distance from initial position)
            const realAltitude = gameState.rocket.initialY - gameState.rocket.y;
            const spaceProgress = Math.min(realAltitude / (canvas.height * 2), 1);

            // Draw gradient background that changes based on altitude
            const gradient = ctx.createLinearGradient(0, 0, 0, canvas.height);
            if (spaceProgress < 0.3) {
                // Atmosphere
                gradient.addColorStop(0, '#87ceeb');
                gradient.addColorStop(0.5, '#4a90e2');
                gradient.addColorStop(1, '#2d5f8d');
            } else if (spaceProgress < 0.7) {
                // Transition to space
                const t = (spaceProgress - 0.3) / 0.4;
                gradient.addColorStop(0, `rgba(0, 4, 40, ${t})`);
                gradient.addColorStop(0.5, `rgba(0, 78, 146, ${1 - t})`);
                gradient.addColorStop(1, `rgba(45, 95, 141, ${1 - t * 0.5})`);
            } else {
                // Deep space
                gradient.addColorStop(0, '#000428');
                gradient.addColorStop(0.5, '#001122');
                gradient.addColorStop(1, '#000000');
            }
            ctx.fillStyle = gradient;
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Draw stars (more visible in space with twinkling effect)
            gameState.stars.forEach(star => {
                // Convert world coordinates to screen coordinates
                const starScreenY = star.y - gameState.cameraOffset;
                if (starScreenY > -10 && starScreenY < canvas.height + 10) {
                    const twinkle = Math.sin(Date.now() / 1000 + star.twinkle) * 0.3 + 0.7;
                    const starOpacity = Math.min(star.opacity * spaceProgress * 2 * twinkle, 1);
                    ctx.fillStyle = `rgba(255, 255, 255, ${starOpacity})`;
                    ctx.beginPath();
                    ctx.arc(star.x, starScreenY, star.size, 0, Math.PI * 2);
                    ctx.fill();
                }
            });

            // Draw planets (visible when in space)
            if (realAltitude > 300) {  // Show planets when 300 units above ground
                gameState.planets.forEach(planet => {
                    const planetScreenY = planet.y - gameState.cameraOffset;

                    // Only draw if planet is visible on screen
                    if (planetScreenY > -planet.size - 50 && planetScreenY < canvas.height + planet.size + 50) {
                        // Fade in planets based on altitude
                        const planetOpacity = Math.min((realAltitude - 300) / 200, 1);
                        ctx.save();
                        ctx.globalAlpha = planetOpacity;

                        // Draw atmosphere if planet has one
                        if (planet.hasAtmosphere) {
                            ctx.fillStyle = planet.atmosphereColor;
                            ctx.beginPath();
                            ctx.arc(planet.x, planetScreenY, planet.size + 15, 0, Math.PI * 2);
                            ctx.fill();
                        }

                        // Draw planet body
                        ctx.fillStyle = planet.color;
                        ctx.beginPath();
                        ctx.arc(planet.x, planetScreenY, planet.size, 0, Math.PI * 2);
                        ctx.fill();

                        // Add planet-specific features
                        if (planet.craters) {
                            // Moon craters
                            ctx.fillStyle = 'rgba(100, 100, 100, 0.4)';
                            for (let i = 0; i < 5; i++) {
                                const angle = (i / 5) * Math.PI * 2;
                                const distance = planet.size * 0.4;
                                const craterX = planet.x + Math.cos(angle) * distance;
                                const craterY = planetScreenY + Math.sin(angle) * distance;
                                ctx.beginPath();
                                ctx.arc(craterX, craterY, planet.size * 0.15, 0, Math.PI * 2);
                                ctx.fill();
                            }
                        }

                        if (planet.stripes) {
                            // Jupiter stripes
                            ctx.strokeStyle = 'rgba(139, 69, 19, 0.6)';
                            ctx.lineWidth = 6;
                            for (let i = -2; i <= 2; i++) {
                                ctx.beginPath();
                                const y = planetScreenY + i * (planet.size * 0.3);
                                ctx.moveTo(planet.x - planet.size * 0.9, y);
                                ctx.lineTo(planet.x + planet.size * 0.9, y);
                                ctx.stroke();
                            }
                        }

                        if (planet.hasRings) {
                            // Saturn rings
                            ctx.strokeStyle = 'rgba(210, 180, 140, 0.8)';
                            ctx.lineWidth = 15;
                            ctx.beginPath();
                            ctx.ellipse(planet.x, planetScreenY, planet.size * 1.6, planet.size * 0.3, 0, 0, Math.PI * 2);
                            ctx.stroke();

                            ctx.strokeStyle = 'rgba(160, 130, 90, 0.6)';
                            ctx.lineWidth = 8;
                            ctx.beginPath();
                            ctx.ellipse(planet.x, planetScreenY, planet.size * 1.4, planet.size * 0.25, 0, 0, Math.PI * 2);
                            ctx.stroke();
                        }

                        // Add subtle shading to make planet look spherical
                        const gradient = ctx.createRadialGradient(
                            planet.x - planet.size * 0.3,
                            planetScreenY - planet.size * 0.3,
                            planet.size * 0.1,
                            planet.x,
                            planetScreenY,
                            planet.size
                        );
                        gradient.addColorStop(0, 'rgba(255, 255, 255, 0.3)');
                        gradient.addColorStop(0.5, 'rgba(255, 255, 255, 0)');
                        gradient.addColorStop(1, 'rgba(0, 0, 0, 0.4)');
                        ctx.fillStyle = gradient;
                        ctx.beginPath();
                        ctx.arc(planet.x, planetScreenY, planet.size, 0, Math.PI * 2);
                        ctx.fill();

                        ctx.restore();
                    }
                });

                // Draw ISS (space station) differently
                gameState.planets.filter(p => p.isStation).forEach(station => {
                    const stationScreenY = station.y - gameState.cameraOffset;
                    if (stationScreenY > -50 && stationScreenY < canvas.height + 50) {
                        ctx.save();
                        ctx.globalAlpha = Math.min((realAltitude - 300) / 200, 1);
                        ctx.fillStyle = station.color;
                        ctx.fillRect(station.x - 15, stationScreenY - 5, 30, 10);
                        ctx.fillRect(station.x - 5, stationScreenY - 15, 10, 30);
                        ctx.fillStyle = '#ffaa00';
                        ctx.fillRect(station.x - 20, stationScreenY - 3, 8, 6);
                        ctx.fillRect(station.x + 12, stationScreenY - 3, 8, 6);
                        ctx.restore();
                    }
                });
            }

            // Draw asteroids (in mid-space)
            if (realAltitude > 2000) {
                gameState.asteroids.forEach(asteroid => {
                    const asteroidScreenY = asteroid.y - gameState.cameraOffset;
                    if (asteroidScreenY > -20 && asteroidScreenY < canvas.height + 20) {
                        ctx.save();
                        ctx.translate(asteroid.x, asteroidScreenY);
                        ctx.rotate(asteroid.rotation);
                        asteroid.rotation += asteroid.rotationSpeed;

                        ctx.fillStyle = asteroid.color;
                        ctx.beginPath();
                        // Draw irregular asteroid shape
                        for (let i = 0; i < 6; i++) {
                            const angle = (i / 6) * Math.PI * 2;
                            const radius = asteroid.size * (0.7 + Math.random() * 0.3);
                            const x = Math.cos(angle) * radius;
                            const y = Math.sin(angle) * radius;
                            if (i === 0) ctx.moveTo(x, y);
                            else ctx.lineTo(x, y);
                        }
                        ctx.closePath();
                        ctx.fill();

                        // Add some texture
                        ctx.fillStyle = 'rgba(0, 0, 0, 0.3)';
                        ctx.beginPath();
                        ctx.arc(asteroid.size * 0.3, 0, asteroid.size * 0.2, 0, Math.PI * 2);
                        ctx.fill();
                        ctx.restore();
                    }
                });
            }

            // Draw distant galaxies (in deep space beyond 80k)
            if (realAltitude > 80000) {
                gameState.galaxies.forEach(galaxy => {
                    const galaxyScreenY = galaxy.y - gameState.cameraOffset;
                    if (galaxyScreenY > -200 && galaxyScreenY < canvas.height + 200) {
                        ctx.save();
                        ctx.globalAlpha = 0.4;
                        ctx.translate(galaxy.x, galaxyScreenY);
                        ctx.rotate(galaxy.rotation);

                        // Draw spiral galaxy
                        const grad = ctx.createRadialGradient(0, 0, 0, 0, 0, galaxy.size);
                        grad.addColorStop(0, galaxy.color);
                        grad.addColorStop(0.5, galaxy.color.replace(')', ', 0.5)').replace('rgb', 'rgba'));
                        grad.addColorStop(1, 'rgba(0, 0, 0, 0)');
                        ctx.fillStyle = grad;
                        ctx.beginPath();
                        ctx.arc(0, 0, galaxy.size, 0, Math.PI * 2);
                        ctx.fill();

                        // Draw spiral arms
                        ctx.strokeStyle = galaxy.color;
                        ctx.lineWidth = 3;
                        ctx.globalAlpha = 0.6;
                        for (let i = 0; i < 3; i++) {
                            ctx.beginPath();
                            for (let a = 0; a < Math.PI * 4; a += 0.1) {
                                const r = (a / (Math.PI * 4)) * galaxy.size * 0.8;
                                const x = Math.cos(a + i * Math.PI * 2 / 3) * r;
                                const y = Math.sin(a + i * Math.PI * 2 / 3) * r;
                                if (a === 0) ctx.moveTo(x, y);
                                else ctx.lineTo(x, y);
                            }
                            ctx.stroke();
                        }
                        ctx.restore();
                    }
                });
            }

            // Calculate ground position in screen coordinates
            const screenGroundLevel = gameState.initialGroundLevel - gameState.cameraOffset;

            // Only draw ground if it's visible
            if (screenGroundLevel < canvas.height + 100) {
                // Draw ground
                ctx.fillStyle = '#2d5016';
                ctx.fillRect(0, screenGroundLevel, canvas.width, canvas.height - screenGroundLevel);

                // Draw road
                ctx.fillStyle = '#444444';
                ctx.fillRect(0, screenGroundLevel, canvas.width, 30);

                // Road lines
                ctx.strokeStyle = '#ffff00';
                ctx.lineWidth = 3;
                ctx.setLineDash([20, 15]);
                ctx.beginPath();
                ctx.moveTo(0, screenGroundLevel + 15);
                ctx.lineTo(canvas.width, screenGroundLevel + 15);
                ctx.stroke();
                ctx.setLineDash([]);

                // Draw buildings
                gameState.buildings.forEach(building => {
                    const buildingY = screenGroundLevel - building.height;
                    if (buildingY < canvas.height + 10) {
                        ctx.fillStyle = building.color;
                        ctx.fillRect(
                            building.x,
                            buildingY,
                            building.width,
                            building.height
                        );

                        // Windows
                        ctx.fillStyle = realAltitude < 200 ? '#ffff00' : '#ffaa00';
                        for (let i = 0; i < building.height / 20; i++) {
                            for (let j = 0; j < 3; j++) {
                                ctx.fillRect(
                                    building.x + 5 + j * 15,
                                    buildingY + 5 + i * 20,
                                    10,
                                    10
                                );
                            }
                        }
                    }
                });
            }

            // Draw particles (with camera offset)
            gameState.particles.forEach(p => {
                ctx.save();
                ctx.globalAlpha = p.life;
                ctx.fillStyle = p.color;
                ctx.beginPath();
                const particleScreenY = p.y - gameState.cameraOffset;
                ctx.arc(p.x, particleScreenY, p.size, 0, Math.PI * 2);
                ctx.fill();
                ctx.restore();
            });

            // Draw rocket (with camera offset)
            const rocketScreenY = gameState.rocket.y - gameState.cameraOffset;
            ctx.save();
            ctx.translate(gameState.rocket.x, rocketScreenY + gameState.rocket.height / 2);
            ctx.rotate(gameState.rocket.angle);
            ctx.translate(0, -gameState.rocket.height / 2);

            // Rocket body
            ctx.fillStyle = '#cccccc';
            ctx.fillRect(-gameState.rocket.width / 2, 0, gameState.rocket.width, gameState.rocket.height * 0.7);

            // Rocket nose
            ctx.fillStyle = '#ff0000';
            ctx.beginPath();
            ctx.moveTo(-gameState.rocket.width / 2, 0);
            ctx.lineTo(gameState.rocket.width / 2, 0);
            ctx.lineTo(0, -gameState.rocket.height * 0.3);
            ctx.closePath();
            ctx.fill();

            // Rocket fins
            ctx.fillStyle = '#ff6600';
            ctx.beginPath();
            ctx.moveTo(-gameState.rocket.width / 2, gameState.rocket.height * 0.7);
            ctx.lineTo(-gameState.rocket.width / 2 - 15, gameState.rocket.height * 0.7 + 20);
            ctx.lineTo(-gameState.rocket.width / 2, gameState.rocket.height * 0.7 + 20);
            ctx.closePath();
            ctx.fill();

            ctx.beginPath();
            ctx.moveTo(gameState.rocket.width / 2, gameState.rocket.height * 0.7);
            ctx.lineTo(gameState.rocket.width / 2 + 15, gameState.rocket.height * 0.7 + 20);
            ctx.lineTo(gameState.rocket.width / 2, gameState.rocket.height * 0.7 + 20);
            ctx.closePath();
            ctx.fill();

            // Rocket window
            ctx.fillStyle = '#00aaff';
            ctx.beginPath();
            ctx.arc(0, gameState.rocket.height * 0.25, 8, 0, Math.PI * 2);
            ctx.fill();

            // Engine fire when boosting
            if (gameState.isLaunched && gameState.fuel > 0) {
                const flameHeight = 20 + Math.random() * 10;
                ctx.fillStyle = '#ff6600';
                ctx.beginPath();
                ctx.moveTo(-10, gameState.rocket.height * 0.7 + 20);
                ctx.lineTo(10, gameState.rocket.height * 0.7 + 20);
                ctx.lineTo(5, gameState.rocket.height * 0.7 + 20 + flameHeight);
                ctx.lineTo(-5, gameState.rocket.height * 0.7 + 20 + flameHeight);
                ctx.closePath();
                ctx.fill();

                ctx.fillStyle = '#ffff00';
                ctx.beginPath();
                ctx.moveTo(-5, gameState.rocket.height * 0.7 + 20);
                ctx.lineTo(5, gameState.rocket.height * 0.7 + 20);
                ctx.lineTo(2, gameState.rocket.height * 0.7 + 20 + flameHeight * 0.6);
                ctx.lineTo(-2, gameState.rocket.height * 0.7 + 20 + flameHeight * 0.6);
                ctx.closePath();
                ctx.fill();
            }

            ctx.restore();

            // Draw mini-map (vertical overview on the right)
            const mapWidth = 100;
            const mapHeight = canvas.height * 0.8;
            const mapX = canvas.width - mapWidth - 15;
            const mapY = (canvas.height - mapHeight) / 2;
            const maxMapAltitude = 200000; // Maximum altitude we can reach

            // Draw map background (rounded rectangle for better compatibility)
            ctx.save();
            ctx.fillStyle = 'rgba(10, 20, 40, 0.85)';
            ctx.strokeStyle = 'rgba(100, 200, 255, 0.9)';
            ctx.lineWidth = 3;

            // Draw rounded rectangle
            const radius = 20;
            ctx.beginPath();
            ctx.moveTo(mapX + radius, mapY);
            ctx.lineTo(mapX + mapWidth - radius, mapY);
            ctx.quadraticCurveTo(mapX + mapWidth, mapY, mapX + mapWidth, mapY + radius);
            ctx.lineTo(mapX + mapWidth, mapY + mapHeight - radius);
            ctx.quadraticCurveTo(mapX + mapWidth, mapY + mapHeight, mapX + mapWidth - radius, mapY + mapHeight);
            ctx.lineTo(mapX + radius, mapY + mapHeight);
            ctx.quadraticCurveTo(mapX, mapY + mapHeight, mapX, mapY + mapHeight - radius);
            ctx.lineTo(mapX, mapY + radius);
            ctx.quadraticCurveTo(mapX, mapY, mapX + radius, mapY);
            ctx.closePath();
            ctx.fill();
            ctx.stroke();

            // Draw altitude markers
            ctx.fillStyle = 'rgba(255, 255, 255, 0.5)';
            ctx.font = '10px Arial';
            ctx.textAlign = 'left';
            const markers = [0, 50000, 100000, 150000, 200000];
            markers.forEach(alt => {
                const markerY = mapY + mapHeight - (alt / maxMapAltitude) * mapHeight;
                if (markerY >= mapY && markerY <= mapY + mapHeight) {
                    ctx.fillText(alt / 1000 + 'k', mapX - 30, markerY + 3);
                    ctx.fillStyle = 'rgba(255, 255, 255, 0.3)';
                    ctx.fillRect(mapX + 5, markerY, mapWidth - 10, 1);
                    ctx.fillStyle = 'rgba(255, 255, 255, 0.5)';
                }
            });

            // Helper function to convert altitude to map Y position
            function altitudeToMapY(altitude) {
                const altFromGround = gameState.rocket.initialY - altitude;
                const ratio = altFromGround / maxMapAltitude;
                return mapY + mapHeight - (ratio * mapHeight);
            }

            // Draw Earth at bottom
            const earthY = altitudeToMapY(gameState.rocket.initialY);
            if (earthY >= mapY && earthY <= mapY + mapHeight) {
                ctx.fillStyle = '#4a90e2';
                ctx.beginPath();
                ctx.arc(mapX + mapWidth / 2, earthY, 8, 0, Math.PI * 2);
                ctx.fill();
                ctx.fillStyle = '#2d5016';
                ctx.beginPath();
                ctx.arc(mapX + mapWidth / 2, earthY, 6, 0, Math.PI * 2);
                ctx.fill();
            }

            // Draw planets on map
            gameState.planets.forEach(planet => {
                const planetMapY = altitudeToMapY(planet.y);
                if (planetMapY >= mapY - 5 && planetMapY <= mapY + mapHeight + 5) {
                    // Check if passed
                    const isPassed = gameState.rocket.y < planet.y;

                    ctx.fillStyle = isPassed ? 'rgba(100, 100, 100, 0.5)' : planet.color;
                    ctx.beginPath();
                    const size = planet.isStation ? 3 : Math.min(planet.size / 15, 6);
                    ctx.arc(mapX + mapWidth / 2, planetMapY, size, 0, Math.PI * 2);
                    ctx.fill();

                    // Add ring for Saturn
                    if (planet.hasRings && !isPassed) {
                        ctx.strokeStyle = planet.color;
                        ctx.lineWidth = 1;
                        ctx.beginPath();
                        ctx.ellipse(mapX + mapWidth / 2, planetMapY, size * 1.5, size * 0.5, 0, 0, Math.PI * 2);
                        ctx.stroke();
                    }
                }
            });

            // Draw galaxies on map
            if (realAltitude > 80000) {
                gameState.galaxies.forEach(galaxy => {
                    const galaxyMapY = altitudeToMapY(galaxy.y);
                    if (galaxyMapY >= mapY - 5 && galaxyMapY <= mapY + mapHeight + 5) {
                        const isPassed = gameState.rocket.y < galaxy.y;
                        ctx.fillStyle = isPassed ? 'rgba(100, 100, 100, 0.3)' : galaxy.color.replace(')', ', 0.6)').replace('rgb', 'rgba');
                        ctx.beginPath();
                        ctx.arc(mapX + mapWidth / 2, galaxyMapY, 4, 0, Math.PI * 2);
                        ctx.fill();
                    }
                });
            }

            // Draw rocket position on map (highlighted)
            const rocketMapY = altitudeToMapY(gameState.rocket.y);
            if (rocketMapY >= mapY - 20 && rocketMapY <= mapY + mapHeight + 20) {
                // Pulsing effect
                const pulse = Math.sin(Date.now() / 200) * 0.3 + 0.7;

                // Outer glow (larger and brighter)
                ctx.fillStyle = `rgba(255, 255, 0, ${pulse * 0.5})`;
                ctx.beginPath();
                ctx.arc(mapX + mapWidth / 2, rocketMapY, 12, 0, Math.PI * 2);
                ctx.fill();

                // Rocket marker (bigger)
                ctx.fillStyle = `rgba(255, 100, 0, ${pulse})`;
                ctx.strokeStyle = 'rgba(255, 255, 0, 1)';
                ctx.lineWidth = 2;
                ctx.beginPath();
                ctx.moveTo(mapX + mapWidth / 2, rocketMapY - 8);
                ctx.lineTo(mapX + mapWidth / 2 - 5, rocketMapY + 5);
                ctx.lineTo(mapX + mapWidth / 2 + 5, rocketMapY + 5);
                ctx.closePath();
                ctx.fill();
                ctx.stroke();

                // Horizontal line to show exact position
                ctx.strokeStyle = 'rgba(255, 255, 0, 0.8)';
                ctx.lineWidth = 2;
                ctx.setLineDash([5, 3]);
                ctx.beginPath();
                ctx.moveTo(mapX + 5, rocketMapY);
                ctx.lineTo(mapX + mapWidth - 5, rocketMapY);
                ctx.stroke();
                ctx.setLineDash([]);
            }

            ctx.restore();

            // Update UI
            const speed = Math.abs(Math.round(gameState.rocket.velocity * 10));
            const displayAltitude = Math.max(0, Math.round(realAltitude));
            document.getElementById('speed').textContent = speed;
            document.getElementById('altitude').textContent = displayAltitude;
            const fuelPercentage = (gameState.fuel / gameState.maxFuel) * 100;
            document.getElementById('fuelBar').style.width = fuelPercentage + '%';

            let status = 'Pronto al decollo';
            if (gameState.isCrashed) {
                status = 'SCHIANTATO!';
            } else if (gameState.isLaunched) {
                if (gameState.fuel > 0) {
                    status = 'In volo';
                } else {
                    status = 'CARBURANTE ESAURITO - CADUTA!';
                }
            }
            document.getElementById('status').textContent = status;

            // Check if near any planet
            let nearPlanetText = '';
            if (realAltitude > 300) {
                let closestPlanet = null;
                let closestDistance = Infinity;

                gameState.planets.forEach(planet => {
                    const distance = Math.abs(gameState.rocket.y - planet.y);
                    if (distance < closestDistance && distance < 300) {
                        closestDistance = distance;
                        closestPlanet = planet;
                    }
                });

                if (closestPlanet) {
                    nearPlanetText = `🪐 Vicino a ${closestPlanet.name}!`;
                } else if (realAltitude > 500) {
                    nearPlanetText = '🌌 Nello spazio profondo';
                }
            }
            document.getElementById('nearPlanet').textContent = nearPlanetText;
        }

        function resetGame() {
            gameState.rocket.x = canvas.width / 2;
            gameState.rocket.y = canvas.height - 100;
            gameState.rocket.initialY = canvas.height - 100;
            gameState.rocket.velocity = 0;
            gameState.rocket.angle = 0;
            gameState.fuel = 500;
            gameState.isLaunched = false;
            gameState.isCrashed = false;
            gameState.cameraOffset = (canvas.height - 100) - (canvas.height * 0.6);
            gameState.particles = [];
            document.getElementById('gameOver').style.display = 'none';
        }

        function gameLoop() {
            update();
            draw();
            requestAnimationFrame(gameLoop);
        }

        // Handle window resize
        window.addEventListener('resize', () => {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
            gameState.initialGroundLevel = canvas.height - 50;
            if (!gameState.isLaunched) {
                gameState.rocket.y = canvas.height - 100;
                gameState.rocket.initialY = canvas.height - 100;
            }
        });

        // Start game loop
        gameLoop();
    </script>
</body>
</html>
